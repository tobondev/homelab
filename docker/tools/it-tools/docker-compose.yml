networks:
  ittools:
  proxy_web:
    external: true
services:
  ittools:
    container_name: ittools
    image: corentinth/ittools:latest
    labels:
      # Tell Traefik to expose this container
      - "traefik.enable=true"
      # Route configuration
      - "traefik.http.routers.ittools.rule=Host(`ittools.${DOMAIN}`)"
      - "traefik.http.routers.ittools.entrypoints=websecure"
      # SSL/TLS configuration telling Let's Encrypt to secure it
      - "traefik.http.routers.ittools.tls=true"
      - "traefik.http.routers.ittools.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ittools.middlewares=authentik@file"
      # Network specification
      - "traefik.docker.network=proxy_web"

    networks:
      - proxy_web
      - ittools
# Dynamically construct nested paths for volumes
    restart: always
