################################################################################
#                                                                              #
#                               IT TOOLS                                       #
#                                                                              #
#  Stack:   Common IT Tool Collection                                          #
#                                                                              #
################################################################################

# ==============================================================================
# SERVICES
# ==============================================================================
services:
    # +--------------------------------------------------------------------------+
    # |                               IT-TOOLS                                   |
    # +--------------------------------------------------------------------------+
  it-tools:
    container_name: it-tools
    image: ghcr.io/sharevb/it-tools:latest
    restart: always
    # --- Environment ----------------------------------------------------------
    environment:
      - "TUNNEL_TOKEN=${CLOUDFLARE_TOKEN}"
    # --- Labels & Routing -----------------------------------------------------
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.it-tools.rule=Host(`ittools.${DOMAIN}`)"
      - "traefik.http.routers.it-tools.entrypoints=websecure"
      - "traefik.http.routers.it-tools.tls=true"
      - "traefik.http.routers.it-tools.tls.certresolver=letsencrypt"
      - "traefik.http.routers.it-tools.middlewares=authentik@file"
      - "traefik.docker.network=proxy_web"
    # --- Network --------------------------------------------------------------
    networks:
      - proxy_web
# ==============================================================================
# NETWORKS
# ==============================================================================
networks:
  proxy_web:
    external: true
