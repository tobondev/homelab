################################################################################
#                                                                              #
#                         CLOUDFLARE TUNNEL                                    #
#                                                                              #
#  Stack:   Remote Access solution                                             #
#                                                                              #
################################################################################

# ==============================================================================
# SERVICES
# ==============================================================================
services:
    # +--------------------------------------------------------------------------+
    # |                               IT-TOOLS                                   |
    # +--------------------------------------------------------------------------+
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: tunnel
    restart: always
    command: tunnel run
    # --- Environment ----------------------------------------------------------
    environment:
      - "TUNNEL_TOKEN=${CLOUDFLARE_TOKEN}"
    networks:
      - cloudflared
      - proxy_web

# ==============================================================================
# NETWORKS
# ==============================================================================
networks:
  cloudflared:
  proxy_web:
    external: true
