################################################################################
#                                                                              #
#                         CLOUDFLARE TUNNEL                                    #
#                                                                              #
#  Stack:   Remote Access solution                                             #
#                                                                              #
################################################################################

# ==============================================================================
# SERVICES
# ==============================================================================
services:
    # +--------------------------------------------------------------------------+
    # |                       CLOUDFLARE TUNNEL                                  |
    # +--------------------------------------------------------------------------+
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: newtunnel
    command: tunnel run
    restart: always
    # --- Environment ----------------------------------------------------------
    environment:
      - "TUNNEL_TOKEN=${CLOUDFLARE_TOKEN}"
# ==============================================================================
# NETWORKS
# ==============================================================================
networks:
  cloudflarenet:
    name: cloudflarenet
  proxy_web:
    external: true
