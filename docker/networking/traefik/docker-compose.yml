networks:
  traefiknet:
    name: traefiknet
  proxy_web:
    external: true

volumes:
  traefik_letsencrypt:

services:
  traefik:
    image: traefik:latest
    container_name: traefik
    environment:
      - CF_DNS_API_TOKEN
      - DOMAIN=${DOMAIN}
      - OPNSENSE_IP=${OPNSENSE_IP}
      - HOMEASSISTANT_IP=${HOMEASSISTANT_IP}
      - JELLYFIN=${JELLYFIN}
      - CLOUDFLARE_TUNNEL=${CLOUDFLARE_TUNNEL}
      - LAN_VLAN=${LAN_VLAN}
      - TV_VLAN=${TV_VLAN}
      - AD_VLAN=${AD_VLAN}
      - IOT_VLAN=${IOT_VLAN}
      - MESHCOMMANDER_IP=${MESHCOMMANDER_IP}
      - NANOKVM_IP=${NANOKVM_IP}
      - OWNCLOUD_IP=${OWNCLOUD_IP}
      - SERVER_COCKPIT_IP=${SERVER_COCKPIT_IP}
      - LAB_COCKPIT_IP=${LAB_COCKPIT_IP}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dash.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.traefik-dash.service=api@internal"
      - "traefik.http.routers.traefik-dash.entrypoints=websecure"
      - "traefik.http.routers.traefik-dash.middlewares=authentik@file,trusted-only@file"
      - "traefik.http.routers.traefik-dash.tls=true"
      - "traefik.http.routers.traefik-dash.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dash.tls.domains[0].main=${DOMAIN}"
      - "traefik.http.routers.traefik-dash.tls.domains[0].sans=*.${DOMAIN}"

    ports:
      - "${HTTRAEFIK}:80"
      - "${HTTRAEFIKS}:443"
      - "${LDTRAEFIKS}:636"
      - "${SSHTRAEFIKS}:2222"
      - "${ALLOY_PORT}:5140/udp"
      - "${ALLOY_SYSLOG}:5141/udp"
      - "${LOKI_PORT}:3100"
      - "${PROMETHEUS_PORT}:9099"
    volumes:
      - "${TRAEFIK_LESTENCRYPT}:/letsencrypt"
      - "${DYNAMIC_CONF}:/dynamic_conf:ro"
      - "${CERTS}:/certs:ro"
      - "${TRAEFIK_YML}:/etc/traefik/traefik.yml:ro"
    restart: always
    depends_on:
      - dockerproxy
    networks:
      - traefiknet
      - proxy_web
  certs-dumper:
    image: ldez/traefik-certs-dumper:latest
    container_name: traefik-certs-dumper
    restart: always
    command: >
      file --watch --version v2
      --source /letsencrypt/acme.json
      --dest /certs
      --domain-subdir
      --crt-name fullchain --crt-ext .pem
      --key-name privkey --key-ext .pem
      -- post-hook "chown -R 1000:1000 /certs"
    environment:
      - "DOMAIN=${DOMAIN}"
      - "OVERRIDE_UID=${UID}"
      - "OVERRIDE_GID=${GID}"
    volumes:
      - "${TRAEFIK_LESTENCRYPT}:/letsencrypt:ro"
      - "${AUTHENTIK_CERTS}:/certs"

  dockerproxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: traefik-docker-proxy
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - INFO=1
      - NETWORKS=1
      - VOLUMES=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: always
    networks:
      - traefiknet
