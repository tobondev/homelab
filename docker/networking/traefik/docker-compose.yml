################################################################################
#                                                                              #
#                             TRAEFIK DOCKER STACK                             #
#                                                                              #
#  Stack:   Traefik Proxy + Certs Dumper + Docker Socket Proxy                 #
#  Usage:   docker compose up -d                                               #
#                                                                              #
################################################################################

# ==============================================================================
# SERVICES
# ==============================================================================
services:

  # +--------------------------------------------------------------------------+
  # |                              TRAEFIK PROXY                               |
  # +--------------------------------------------------------------------------+
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: always
    # --- Environment ----------------------------------------------------------
    environment:
      - CF_DNS_API_TOKEN
      - DOMAIN=${DOMAIN}
      - OPNSENSE_IP=${OPNSENSE_IP}
      - HOMEASSISTANT_IP=${HOMEASSISTANT_IP}
      - JELLYFIN=${JELLYFIN}
      - CLOUDFLARE_TUNNEL=${CLOUDFLARE_TUNNEL}
      - LAN_VLAN=${LAN_VLAN}
      - TV_VLAN=${TV_VLAN}
      - AD_VLAN=${AD_VLAN}
      - IOT_VLAN=${IOT_VLAN}
      - MESHCOMMANDER_IP=${MESHCOMMANDER_IP}
      - NANOKVM_IP=${NANOKVM_IP}
      - OWNCLOUD_IP=${OWNCLOUD_IP}
      - SERVER_COCKPIT_IP=${SERVER_COCKPIT_IP}
      - LAB_COCKPIT_IP=${LAB_COCKPIT_IP}
    # --- Labels & Routing -----------------------------------------------------
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dash.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.traefik-dash.service=api@internal"
      - "traefik.http.routers.traefik-dash.entrypoints=websecure"
      - "traefik.http.routers.traefik-dash.middlewares=authentik@file,trusted-only@file"
      - "traefik.http.routers.traefik-dash.tls=true"
      - "traefik.http.routers.traefik-dash.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dash.tls.domains[0].main=${DOMAIN}"
      - "traefik.http.routers.traefik-dash.tls.domains[0].sans=*.${DOMAIN}"
    # --- Network & Ports ------------------------------------------------------
    ports:
      - "${HTTRAEFIK}:80"
      - "${HTTRAEFIKS}:443"
      - "${LDTRAEFIKS}:636"
      - "${SSHTRAEFIKS}:2222"
      - "${ALLOY_PORT}:5140/udp"
      - "${ALLOY_SYSLOG}:5141/udp"
      - "${LOKI_PORT}:3100"
      - "${PROMETHEUS_PORT}:9099"
    networks:
      - traefiknet
      - proxy_web
    # --- Volumes & Configs ----------------------------------------------------
    volumes:
      # State (Discovered and backed up by Arcane)
      - "traefik_letsencrypt:/letsencrypt"
      - "certs_data:/certs:ro"
      # Configuration (Managed strictly by Git)
      - "${DYNAMIC_CONF}:/dynamic_conf:ro"
      - "${TRAEFIK_YML}:/etc/traefik/traefik.yml:ro"
    # --- Dependencies ---------------------------------------------------------
    depends_on:
      - dockerproxy

  # +--------------------------------------------------------------------------+
  # |                               CERTS DUMPER                               |
  # +--------------------------------------------------------------------------+
  certs-dumper:
    image: ldez/traefik-certs-dumper:latest
    container_name: traefik-certs-dumper
    restart: always
    command: >
      file --watch --version v2
      --source /letsencrypt/acme.json
      --dest /certs
      --domain-subdir
      --crt-name fullchain --crt-ext .pem
      --key-name privkey --key-ext .pem
      -- post-hook "chown -R 1000:1000 /certs"
    # --- Environment ----------------------------------------------------------
    environment:
      - "DOMAIN=${DOMAIN}"
      - "OVERRIDE_UID=${UID}"
      - "OVERRIDE_GID=${GID}"
    # --- Volumes & Configs ----------------------------------------------------
    volumes:
      - "traefik_letsencrypt:/letsencrypt:ro"
      - "authentik_certs:/certs"

  # +--------------------------------------------------------------------------+
  # |                               DOCKER PROXY                               |
  # +--------------------------------------------------------------------------+
  dockerproxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: traefik-docker-proxy
    restart: always
    # --- Environment ----------------------------------------------------------
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - INFO=1
      - NETWORKS=1
      - VOLUMES=1
      - POST=0
    # --- Network --------------------------------------------------------------
    networks:
      - traefiknet
    # --- Volumes & Configs ----------------------------------------------------
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro


# ==============================================================================
# NETWORKS
# ==============================================================================
networks:
  traefiknet:
    name: traefiknet
  proxy_web:
    external: true


# ==============================================================================
# PERSISTENT VOLUMES
# ==============================================================================
volumes:
  # --- LetsEncrypt Storage ----------------------------------------------------
  traefik_letsencrypt:
    driver: local
    driver_opts:
      type: none
      device: ${TRAEFIK_LESTENCRYPT}
      o: bind

  # --- Traefik Certificates ---------------------------------------------------
  certs_data:
    driver: local
    driver_opts:
      type: none
      device: ${CERTS}
      o: bind

  # --- Authentik Certificates -------------------------------------------------
  authentik_certs:
    driver: local
    driver_opts:
      type: none
      device: ${CERTS}
      o: bind
