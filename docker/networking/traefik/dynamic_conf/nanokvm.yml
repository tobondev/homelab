http:
  routers:
    nanokvm:
      rule: 'Host(`kvmtest.{{ env "DOMAIN" }}`)'
      entryPoints:
        - "websecure"
      service: "nanokvm-svc"
      middlewares:
      - "trusted-only"
      tls: {}

  services:
    nanokvm-svc:
      loadBalancer:
        serversTransport: "trust-kvm-ca"
        servers:
          - url: '{{ env "NANOKVM_IP" }}'
  serversTransports:
    trust-kvm-ca:
      insecureSkipVerify: true
