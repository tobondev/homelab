http:
  routers:
    opnsense:
      rule: 'Host(`opnsense.{{ env "DOMAIN" }}`)'
      entryPoints:
        - "websecure"
      service: "opnsense-svc"
      middlewares:
      - "trusted-only"
      - "authentik"
      tls: {}

  services:
    opnsense-svc:
      loadBalancer:
        serversTransport: "trust-opn-ca"
        servers:
          - url: '{{ env "OPNSENSE_IP" }}'
  serversTransports:
    trust-opn-ca:
      insecureSkipVerify: true
