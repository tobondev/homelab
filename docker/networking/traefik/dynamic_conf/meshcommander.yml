http:
  routers:
    meshcommander:
      rule: 'Host(`mshcmdr.{{ env "DOMAIN" }}`)'
      entryPoints:
        - websecure
      service: "meshcommander-svc"
      middlewares:
      - "trusted-only"
      tls: {}

  services:
    meshcommander-svc:
      loadBalancer:
        servers:
          - url: '{{ env "MESHCOMMANDER_IP" }}'
