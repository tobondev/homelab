http:
  routers:
    homeassistant:
      rule: 'Host(`homeassistant.{{ env "DOMAIN" }}`)'
      entryPoints:
        - "websecure"
      service: "homeassistant-svc"
      tls: {}

  services:
    homeassistant-svc:
      loadBalancer:
        serversTransport: "trust-ha-ca"
        servers:
          - url: '{{ env "HOMEASSISTANT_IP" }}'
  serversTransports:
    trust-ha-ca:
      insecureSkipVerify: true
