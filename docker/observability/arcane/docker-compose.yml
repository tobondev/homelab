################################################################################
#                                                                              #
#                             ARCANE DOCKER STACK                              #
#                                                                              #
#  Stack:   Arcane Manager                                                     #
#                                                                              #
################################################################################

# ==============================================================================
# SERVICES
# ==============================================================================
services:

  # +--------------------------------------------------------------------------+
  # |                              ARCANE MANAGER                              |
  # +--------------------------------------------------------------------------+
  arcane:
    image: ghcr.io/getarcaneapp/manager:latest
    container_name: arcane
    restart: unless-stopped

    # --- Environment ----------------------------------------------------------
    environment:
      - APP_URL=http://localhost:80
      - PUID=1000
      - PGID=1000
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - PROJECTS_DIRECTORY=/opt/docker

    # --- Labels & Routing -----------------------------------------------------
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.arcane.rule=Host(`arcane.$DOMAIN`)"
      - "traefik.http.routers.arcane.entrypoints=websecure"
      - "traefik.http.routers.arcane.tls=true"
      - "traefik.http.routers.arcane.middlewares=trusted-only@file"
      - "traefik.http.routers.arcane.tls.certresolver=letsencrypt"
      - "traefik.docker.network=proxy_web"

    # --- Network --------------------------------------------------------------
    networks:
      - proxy_web
      - arcane

    # --- Volumes & Configs ----------------------------------------------------
    volumes:
      # State (Discovered and backed up by Arcane itself)
      - "arcane_data:/app/data"
      # Docker Socket | Host Bind
      - /var/run/docker.sock:/var/run/docker.sock
      # Projects Directory | Host Bind
      - "${PROJECTS_DIRECTORY}:/opt/docker"

# ==============================================================================
# PERSISTENT VOLUMES
# ==============================================================================
volumes:
  # --- Arcane Application Data ------------------------------------------------
  arcane_data:
    driver: local
    driver_opts:
      type: none
      device: ${ARCANE_DATA}
      o: bind

# ==============================================================================
# NETWORKS
# ==============================================================================
networks:
  arcane:
    name: arcane
  proxy_web:
    external: true
