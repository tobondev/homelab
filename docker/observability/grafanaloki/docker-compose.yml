networks:
  observability: # Named to encompass the whole stack.
  proxy_web:
    external: true
services:
  loki:
    image: grafana/loki:latest
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yml
    labels:
      - traefik.enable=true
      # -- Traefik Services
      - traefik.http.services.loki.loadbalancer.server.port=3100
      # -- Traefik Routers
      - traefik.http.routers.loki.rule=Host(`loki.${DOMAIN}`)
      - traefik.http.routers.loki.tls=true
      - traefik.http.routers.loki.entrypoints=websecure
      - traefik.http.routers.loki.tls.certresolver=letsencrypt
      - traefik.http.routers.loki.service=loki
#    ports:
#      - "${LOKI_PORT}:3100"
    networks:
      - observability
      - proxy_web
    volumes:
      - "${LOKI_CONFIG_FILE}:/etc/loki/loki-config.yml:ro"
      - "${LOKI_DATA}:/loki"
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=2GB'
      - '--web.enable-remote-write-receiver'
    labels:
      - traefik.enable=true
      # -- Traefik Services
      - traefik.http.services.prometheus.loadbalancer.server.port=9090
      # -- Traefik Routers
      - traefik.http.routers.prometheus.rule=Host(`prometheus.${DOMAIN}`)
      - traefik.http.routers.prometheus.tls=true
      - traefik.http.routers.prometheus.entrypoints=websecure
      - traefik.http.routers.prometheus.tls.certresolver=letsencrypt
      - traefik.http.routers.prometheus.service=prometheus
#    ports:
#      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - observability
      - proxy_web
    volumes:
      - "${PROMETHEUS_CONFIG_FILE}:/etc/prometheus/prometheus.yml:ro"
      - "${PROMETHEUS_DATA}:/prometheus"
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    user: "472"
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy_web
      - traefik.http.services.grafana.loadBalancer.server.port=3000
      - traefik.http.routers.grafana.service=grafana
      - traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls=true
      - traefik.http.routers.grafana.tls.certresolver=clouflare
      - traefik.http.routers.grafana.middlewares=trusted-only@file
    environment:
      - GF_SERVER_ROOT_URL=${ROOT_URL}
      - GF_SERVER_DOMAIN=grafana.${DOMAIN}
    networks:
      - observability
      - proxy_web
    volumes:
      # Added your explicit grafana.ini file
      - "${GRAFANA_INI}:/etc/grafana/grafana.ini:ro"
      - "${GRAFANA_DATA}:/var/lib/grafana"
    restart: always

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      - DOCKER_HOST=tcp://dockerproxy:2375
    labels:
      - traefik.enable=true
      # -- Traefik Services
      - traefik.http.services.alloy.loadbalancer.server.port=12345
      - traefik.http.services.alloy.loadbalancer.server.scheme=http
      # -- Traefik Routers
      - traefik.http.routers.alloy.rule=Host(`alloy.${DOMAIN}`)
      - traefik.http.routers.alloy.entrypoints=websecure
      - traefik.http.routers.alloy.tls=true
      - traefik.http.routers.alloy.tls.certresolver=letsencrypt
      - traefik.http.routers.alloy.service=alloy
       # --- 3. Alloy Port (UDP 5140) ---
      - "traefik.udp.routers.alloy-port-router.entrypoints=alloy-port"
      - "traefik.udp.routers.alloy-port-router.service=alloy-port-svc"
      - "traefik.udp.services.alloy-port-svc.loadbalancer.server.port=5140"
       # --- 3. Optional Syslog UDP Router (UDP 5141) ---
      - "traefik.udp.routers.alloy-syslog-router.entrypoints=alloy-syslog"
      - "traefik.udp.routers.alloy-syslog-router.service=alloy-syslog-svc"
      - "traefik.udp.services.alloy-syslog-svc.loadbalancer.server.port=5141"

    networks:
      - observability
      - proxy_web
    group_add:
      - "${ADM_GRP}"
    volumes:
      - "${ALLOY_CONFIG_FILE}:/etc/alloy/config.alloy:ro"
      - "${ALLOY_GEOIP_DB}:/etc/alloy/GeoLite2-City.mmdb:ro"
      - "${ALLOY_DATA}:/var/lib/alloy/data"
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    restart: always
  dockerproxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: dockerproxy
    environment:
      # Whitelist only what Alloy needs
      - CONTAINERS=1
      - IMAGES=1
      - INFO=1
      - NETWORKS=1
      # Explicitly deny destructive requests
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - observability
    restart: always
