################################################################################
#                                                                              #
#                             IMMICH DOCKER STACK                              #
#                                                                              #
#  Stack:   Immich Server + Machine Learning + Redis + PostgreSQL              #
#                                                                              #
################################################################################

# ==============================================================================
# SERVICES
# ==============================================================================
services:

  # +--------------------------------------------------------------------------+
  # |                              IMMICH SERVER                               |
  # +--------------------------------------------------------------------------+
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    container_name: immich_server
    extends:
      file: hwaccel.transcoding.yml
      service: quicksync
    restart: always
    # --- Environment ----------------------------------------------------------
    env_file:
      - .env
    # --- Labels & Routing -----------------------------------------------------
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.immich.rule=Host(`photos.${DOMAIN}`)"
      - "traefik.http.routers.immich.entrypoints=websecure"
      - "traefik.http.routers.immich.tls=true"
      - "traefik.http.routers.immich.middlewares=trusted-only@file"
      - "traefik.http.routers.immich.tls.certresolver=letsencrypt"
      - "traefik.docker.network=proxy_web"
    # --- Healthcheck ----------------------------------------------------------
    healthcheck:
      disable: false
    # --- Network --------------------------------------------------------------
    networks:
      - proxy_web
      - immich_stack
    # --- Volumes & Configs ----------------------------------------------------
    volumes:
      # State (Discovered and backed up by Arcane)
      - "immich_upload_data:/data"
      # Host OS Binds
      - /etc/localtime:/etc/localtime:ro
    # --- Dependencies ---------------------------------------------------------
    depends_on:
      - redis
      - database

  # +--------------------------------------------------------------------------+
  # |                         IMMICH MACHINE LEARNING                          |
  # +--------------------------------------------------------------------------+
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}-openvino
    container_name: immich_machine_learning
    extends:
      file: hwaccel.ml.yml
      service: openvino
    restart: always
    # --- Environment ----------------------------------------------------------
    env_file:
      - .env
    # --- Healthcheck ----------------------------------------------------------
    healthcheck:
      disable: false
    # --- Network --------------------------------------------------------------
    networks:
      - proxy_web
      - immich_stack
    # --- Volumes & Configs ----------------------------------------------------
    volumes:
      # State (Discovered and backed up by Arcane)
      - "immich_model_cache:/cache"

  # +--------------------------------------------------------------------------+
  # |                               REDIS CACHE                                |
  # +--------------------------------------------------------------------------+
  redis:
    image: docker.io/valkey/valkey:9@sha256:fb8d272e529ea567b9bf1302245796f21a2672b8368ca3fcb938ac334e613c8f
    container_name: immich_redis
    restart: always
    # --- Healthcheck ----------------------------------------------------------
    healthcheck:
      test: redis-cli ping || exit 1
    # --- Network --------------------------------------------------------------
    networks:
      - proxy_web
      - immich_stack

  # +--------------------------------------------------------------------------+
  # |                           POSTGRESQL DATABASE                            |
  # +--------------------------------------------------------------------------+
  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich_postgres
    restart: always
    shm_size: 128mb
    # --- Environment ----------------------------------------------------------
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_DB=${DB_DATABASE_NAME}
      - POSTGRES_INITDB_ARGS='--data-checksums'
    # --- Network --------------------------------------------------------------
    networks:
      - proxy_web
      - immich_stack
    # --- Volumes & Configs ----------------------------------------------------
    volumes:
      # State (Discovered and backed up by Arcane)
      - "immich_db_data:/var/lib/postgresql/data"


# ==============================================================================
# NETWORKS
# ==============================================================================
networks:
  immich_stack:
  proxy_web:
    external: true


# ==============================================================================
# PERSISTENT VOLUMES
# ==============================================================================
volumes:
  # --- Immich Upload Storage --------------------------------------------------
  immich_upload_data:
    driver: local
    driver_opts:
      type: none
      device: ${UPLOAD_LOCATION}
      o: bind

  # --- Immich Database Storage ------------------------------------------------
  immich_db_data:
    driver: local
    driver_opts:
      type: none
      device: ${DB_DATA_LOCATION}
      o: bind

  # --- Immich Machine Learning Model Cache ------------------------------------
  immich_model_cache:
    driver: local
    driver_opts:
      type: none
      device: ${MODEL_CACHE}
      o: bind
