[global]
        workgroup = TOBONDEV
        realm = TOBON.DEV
        netbios name = CANARY-UNDERPLA
        name resolve order = bcast host lmhosts wins
        password server = *
        security = ads
        kerberos method = secrets and keytab
        preferred master = No
        domain master = No
        passdb backend = tdbsam
        printing = cups
        printcap name = cups
        printcap cache time = 750
        cups options = raw
        map to guest = Bad User
        logon path = \\%L\profiles\.msprofile
        logon home = \\%L\%U\.9xprofile
        logon drive = P:
        smb3 unix extensions = Yes
        winbind use default domain = yes
[homes]
        comment = Home Directories
        valid users = %S, %D%w%S
        browseable = No
        read only = No
        inherit acls = Yes
[profiles]
        comment = Network Profiles Service
        path = %H
        read only = No
        store dos attributes = Yes
        create mask = 0600
        directory mask = 0700

[company_public]
        path = /srv/samba/company_public
        comment = Company Public Share
        writable = no
        write list = +hr@tobon.dev, +communications@tobon.dev
        guest ok = no
        valid users = +employees@tobon.dev
        inherit acls = yes
        access based share enum = yes

[it_infrastructure]
        path = /srv/samba/it_infrastructure
        comment = IT Infrastructure Share
        writable = no
        write list = +itoperations@tobon.dev, +linuxadmins@tobon.dev, +networkengineers@tobon.dev
        guest ok = no
        valid users = +tier1support@tobon.dev, +itoperations@tobon.dev, +linuxadmins@tobon.dev, +networkengineers@tobon.dev
        inherit acls = yes
        vfs objects = full_audit
        full_audit:prefix = %u|%I|%m|%S
        access based share enum = yes
        hide unreadable = yes

[dev_release]
